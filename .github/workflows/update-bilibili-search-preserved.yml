name: Update Bilibili Search Preserved Module

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate module from upstream
        run: python scripts/update_bilibili_search_preserved.py

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- blockAds-bilibili-search-preserved.module; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blockAds-bilibili-search-preserved.module
          git commit -m "Sync upstream module with Bilibili search preserved"
          git push
