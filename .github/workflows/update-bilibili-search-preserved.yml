name: Update Bilibili Search Preserved Module

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate module from upstream
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen

          upstream = "https://raw.githubusercontent.com/fmz200/wool_scripts/refs/heads/main/Surge/module/blockAds.module"
          output = Path("blockAds-bilibili-search-preserved.module")

          text = urlopen(upstream, timeout=60).read().decode("utf-8")
          lines = text.splitlines()
          patched = []

          for line in lines:
              if line.startswith("#!name="):
                  patched.append("#!name=广告拦截&净化合集 - 保留哔哩哔哩热搜和搜索发现")
                  continue
              if line.startswith("#!desc="):
                  patched.append("#!desc=自动同步 fmz200/wool_scripts 的 blockAds.module，仅放行哔哩哔哩热搜、搜索发现和默认搜索词，其余规则保持上游原样。")
                  continue
              if line.startswith("#!raw-url="):
                  patched.append("#!raw-url=https://raw.githubusercontent.com/zwjtano/blockAds-module/master/blockAds-bilibili-search-preserved.module")
                  continue

              if (
                  "v2\\/search\\/square" in line
                  and "bilibili" in line
                  and not line.lstrip().startswith("#")
              ):
                  preserved = line.replace("|v2\\/search\\/square", "").replace("v2\\/search\\/square|", "")
                  patched.append("# 保留哔哩哔哩热搜/搜索发现：注释掉 v2/search/square 拦截")
                  patched.append("# " + line)
                  patched.append(preserved)
                  continue

              if (
                  "Search\\/DefaultWords" in line
                  and "biliapi" in line
                  and not line.lstrip().startswith("#")
              ):
                  patched.append("# 保留哔哩哔哩默认搜索词")
                  patched.append("# " + line)
                  continue

              patched.append(line)

          output.write_text("\n".join(patched) + "\n", encoding="utf-8")

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- blockAds-bilibili-search-preserved.module; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blockAds-bilibili-search-preserved.module
          git commit -m "Sync upstream module with Bilibili search preserved"
          git push
